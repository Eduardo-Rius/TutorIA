<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Subtle background for the abstract fallback -->
  <circle cx="200" cy="200" r="180" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" />
  
  <!-- Institutional Abstract Shapes (TutorIA Brand Colors) -->
  <!-- Deep Blue base -->
  <rect x="150" y="150" width="100" height="100" rx="20" fill="#03045E" opacity="0.1" />
  <rect x="140" y="160" width="100" height="100" rx="20" fill="#023E8A" opacity="0.8" />
  
  <!-- Turquoise intersection -->
  <circle cx="230" cy="180" r="40" fill="#00B4D8" opacity="0.9" />
  
  <!-- Orange highlight -->
  <path d="M 230 220 L 260 250 L 200 250 Z" fill="#F77F00" opacity="0.9" />
</svg>
