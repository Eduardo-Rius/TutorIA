<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00B4D8" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="200" cy="200" r="160" fill="#00B4D8" opacity="0.04" />
  
  <path d="M 120 360 C 120 280, 280 280, 280 360" fill="url(#bodyGrad)" />
  <path d="M 140 360 C 140 300, 260 300, 260 360" fill="#00B4D8" opacity="0.2" />

  <!-- Head Leaning Back slightly, scanning -->
  <g transform="translate(0, -15)">
    <rect x="110" y="100" width="180" height="150" rx="60" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="125" y="115" width="150" height="120" rx="45" fill="url(#faceGrad)" />
    
    <!-- Observing Eyes: Large circles with sweeping scan -->
    <g stroke="url(#eyeGrad)" stroke-width="8" fill="none" filter="url(#glow)">
      <circle cx="165" cy="170" r="15" fill="#48CAE4" opacity="0.5" />
      <circle cx="235" cy="170" r="15" fill="#48CAE4" opacity="0.5" />
      <circle cx="165" cy="170" r="6" fill="#03045E" stroke="none" />
      <circle cx="235" cy="170" r="6" fill="#03045E" stroke="none" />
    </g>

    <!-- Scan beam -->
    <path d="M 125 170 C 125 240, 275 240, 275 170" stroke="#00B4D8" stroke-width="2" fill="none" opacity="0.2" />

    <circle cx="200" cy="70" r="10" fill="#00B4D8" filter="url(#glow)" />
    <path d="M 200 80 L 200 100" stroke="#00B4D8" stroke-width="4" opacity="0.6" />
  </g>
</svg>
