<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00B4D8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Aura: Outward rays or teaching waves -->
  <circle cx="200" cy="200" r="160" fill="#00B4D8" opacity="0.05" />
  <path d="M 200 40 L 200 20 M 360 200 L 380 200 M 200 360 L 200 380 M 40 200 L 20 200" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
  <path d="M 313 87 L 327 73 M 313 313 L 327 327 M 87 313 L 73 327 M 87 87 L 73 73" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" opacity="0.2" filter="url(#glow)" />

  <path d="M 120 360 C 120 280, 280 280, 280 360" fill="url(#bodyGrad)" />
  <path d="M 140 360 C 140 300, 260 300, 260 360" fill="#00B4D8" opacity="0.2" />

  <g transform="translate(0, -5)">
    <rect x="110" y="100" width="180" height="150" rx="60" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="125" y="115" width="150" height="120" rx="45" fill="url(#faceGrad)" />
    
    <!-- Explaining Eyes: One slightly raised -->
    <g stroke="url(#eyeGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M 155 175 L 185 175" />
      <path d="M 215 175 Q 230 160 245 175" />
    </g>

    <circle cx="200" cy="70" r="10" fill="#00B4D8" filter="url(#glow)" />
    <path d="M 200 80 L 200 100" stroke="#00B4D8" stroke-width="4" opacity="0.6" />
  </g>

  <!-- Explaining Hand -->
  <g transform="translate(290, 240) rotate(25)">
    <rect x="-20" y="-30" width="40" height="70" rx="20" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="-10" y="-20" width="20" height="50" rx="10" fill="#48CAE4" opacity="0.2" />
    <!-- Pointer spark -->
    <circle cx="0" cy="-45" r="8" fill="#F77F00" filter="url(#glow)" opacity="0.9" />
  </g>
</svg>
