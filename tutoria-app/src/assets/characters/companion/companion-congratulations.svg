<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#F77F00" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFB703" flood-opacity="0.8" />
    </filter>
  </defs>

  <circle cx="200" cy="200" r="170" fill="#FFB703" opacity="0.08" />
  <circle cx="200" cy="200" r="140" fill="#FFB703" opacity="0.12" />
  
  <path d="M 120 360 C 120 280, 280 280, 280 360" fill="url(#bodyGrad)" />
  <path d="M 140 360 C 140 300, 260 300, 260 360" fill="#00B4D8" opacity="0.2" />

  <g transform="translate(0, -10)">
    <rect x="110" y="100" width="180" height="150" rx="60" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="125" y="115" width="150" height="120" rx="45" fill="url(#faceGrad)" />
    
    <!-- Congratulations Eyes: Bright Arcs -->
    <g stroke="url(#eyeGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M 155 175 Q 170 155 185 175" />
      <path d="M 215 175 Q 230 155 245 175" />
    </g>

    <!-- Star/Sparkle accent on face -->
    <path d="M 195 190 L 200 180 L 205 190 L 215 195 L 205 200 L 200 210 L 195 200 L 185 195 Z" fill="#F77F00" opacity="0.5" filter="url(#glow)" />

    <circle cx="200" cy="70" r="14" fill="#FFB703" filter="url(#glow)" />
    <path d="M 200 85 L 200 100" stroke="#FFB703" stroke-width="4" opacity="0.8" />
  </g>
</svg>
