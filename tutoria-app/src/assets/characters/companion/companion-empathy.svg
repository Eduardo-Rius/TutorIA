<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F77F00" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F77F00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Warm, empathetic background -->
  <circle cx="200" cy="200" r="160" fill="#F77F00" opacity="0.04" />
  <circle cx="200" cy="200" r="120" fill="#00B4D8" opacity="0.04" />

  <g transform="translate(0, 10)">
    <path d="M 120 360 C 120 280, 280 280, 280 360" fill="url(#bodyGrad)" />
    <path d="M 140 360 C 140 300, 260 300, 260 360" fill="#F77F00" opacity="0.15" />
  </g>

  <!-- Head leaning forward slightly -->
  <g transform="translate(0, 5) rotate(2, 200, 150)">
    <rect x="110" y="100" width="180" height="150" rx="60" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="125" y="115" width="150" height="120" rx="45" fill="url(#faceGrad)" />

    <!-- Empathy Eyes: Gentle, slightly downturned outside curves -->
    <g stroke="url(#eyeGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M 155 165 Q 170 170 185 165" />
      <path d="M 215 165 Q 230 170 245 165" />
    </g>

    <!-- Warm cheeks -->
    <circle cx="150" cy="185" r="12" fill="#F77F00" opacity="0.2" filter="url(#glow)" />
    <circle cx="250" cy="185" r="12" fill="#F77F00" opacity="0.2" filter="url(#glow)" />

    <!-- Antenna: Soft warm glow -->
    <circle cx="200" cy="70" r="10" fill="#F77F00" opacity="0.8" filter="url(#glow)" />
    <path d="M 200 80 L 200 100" stroke="#F77F00" stroke-width="4" opacity="0.5" />
  </g>
</svg>
