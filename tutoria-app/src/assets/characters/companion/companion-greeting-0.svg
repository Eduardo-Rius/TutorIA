<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>
    <!-- Soft Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00B4D8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Aura / Background -->
  <circle cx="200" cy="200" r="160" fill="#00B4D8" opacity="0.05" />
  <circle cx="200" cy="200" r="120" fill="#00B4D8" opacity="0.08" />

  <!-- Body/Torso -->
  <path d="M 120 360 C 120 280, 280 280, 280 360" fill="url(#bodyGrad)" />
  <path d="M 140 360 C 140 300, 260 300, 260 360" fill="#00B4D8" opacity="0.2" />

  <!-- Head Floating -->
  <g transform="translate(0, -10)">
    <!-- Main Head -->
    <rect x="110" y="100" width="180" height="150" rx="60" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    
    <!-- Face Plate -->
    <rect x="125" y="115" width="150" height="120" rx="45" fill="url(#faceGrad)" />
    
    <!-- Inner Screen Glow -->
    <rect x="125" y="115" width="150" height="120" rx="45" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />

    <!-- Greeting Eyes: Happy Arcs -->
    <g stroke="url(#eyeGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
      <!-- Left Eye -->
      <path d="M 160 175 Q 175 155 190 175" />
      <!-- Right Eye -->
      <path d="M 210 175 Q 225 155 240 175" />
    </g>

    <!-- Cheek Blushes -->
    <circle cx="150" cy="190" r="12" fill="#F77F00" opacity="0.4" filter="url(#glow)" />
    <circle cx="250" cy="190" r="12" fill="#F77F00" opacity="0.4" filter="url(#glow)" />

    <!-- Antenna/Indicator -->
    <circle cx="200" cy="70" r="10" fill="#00B4D8" filter="url(#glow)" />
    <path d="M 200 80 L 200 100" stroke="#00B4D8" stroke-width="4" opacity="0.6" />
  </g>

  <!-- Waving Hand -->
  <g transform="translate(300, 250) rotate(15)">
    <rect x="-25" y="-40" width="50" height="80" rx="25" fill="url(#bodyGrad)" filter="url(#softShadow)" />
    <rect x="-15" y="-30" width="30" height="60" rx="15" fill="#48CAE4" opacity="0.2" />
  </g>
  <!-- Motion Lines for Wave -->
  <path d="M 340 210 Q 355 230 340 250" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 355 215 Q 370 230 355 245" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />
</svg>
