<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Skin Tone and Hair -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F5" />
      <stop offset="100%" stop-color="#E2D1C3" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <!-- Clothing: Blazer/Suit -->
    <linearGradient id="clothingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03045E" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>
    <!-- Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#03045E" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Aura / Background (Order & Leadership) -->
  <circle cx="200" cy="200" r="160" fill="#023E8A" opacity="0.04" />
  <circle cx="200" cy="200" r="120" fill="#023E8A" opacity="0.06" />

  <!-- Body / Bust (Structured, upright) -->
  <g transform="translate(0, 30)">
    <!-- Shoulders / Blazer -->
    <path d="M 110 360 C 110 240, 290 240, 290 360" fill="url(#clothingGrad)" filter="url(#softShadow)" />
    <!-- Lapels -->
    <path d="M 160 260 L 200 330 L 240 260 Z" fill="#F8F9FA" />
    <path d="M 150 250 L 200 360 L 160 360 Z" fill="url(#accentGrad)" opacity="0.8" />
    <path d="M 250 250 L 200 360 L 240 360 Z" fill="url(#accentGrad)" opacity="0.8" />
  </g>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="60" rx="5" fill="#D3C1B2" />

  <!-- Head/Face Shape -->
  <g transform="translate(0, -10)">
    <!-- Face (More angular squircle) -->
    <rect x="140" y="100" width="120" height="150" rx="40" fill="url(#skinGrad)" filter="url(#softShadow)" />
    
    <!-- Hair (Structured short bob / Updo) -->
    <path d="M 130 150 C 130 80, 270 80, 270 150 C 270 180, 280 190, 275 210 C 265 200, 270 150, 260 150 C 240 100, 160 100, 140 150 C 130 150, 135 200, 125 210 C 120 190, 130 180, 130 150 Z" fill="url(#hairGrad)" filter="url(#softShadow)" />
    <path d="M 140 100 Q 200 130 260 100" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" />
    
    <!-- Subtle Facial Features (Leadership, serene, confident) -->
    <g stroke="#03045E" stroke-width="3" fill="none">
      <!-- Minimalist elegant eyebrows to denote experience -->
      <path d="M 165 170 Q 175 165 185 170" />
      <path d="M 215 170 Q 225 165 235 170" />
    </g>
    
    <!-- Elegant Glasses (Half-rim) -->
    <g stroke="#F77F00" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 155 185 L 185 185" />
      <path d="M 215 185 L 245 185" />
      <path d="M 185 185 Q 200 180 215 185" stroke-width="2" />
    </g>

    <!-- Confident subtle smile -->
    <path d="M 190 220 Q 200 225 210 220" stroke="#D3C1B2" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
